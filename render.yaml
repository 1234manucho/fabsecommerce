databases:
  - name: fabs-trading-db

services:
  - type: web
    name: fabs-trading
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app init-db && gunicorn wsgi:application --workers 3 --threads 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fabs-trading-db
          property: connectionString
      - key: COOKIE_SECURE
        value: true
      - key: BANK_MID_MODE
        value: sandbox
      - key: ADMIN_EMAIL
        value: admin@fabstrading.com
      - key: ADMIN_PASSWORD
        generateValue: true
